[project]
name = "lava"
version = "0.1.0"
authors = [
    { name = "Alvaro Mendizabal", email = "alv.mendizabal@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.86",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "kaggle==2.2.4",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]
