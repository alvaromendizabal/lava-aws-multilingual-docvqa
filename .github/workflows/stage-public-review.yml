name: Stage verified public review
on:
  push:
    branches: [portfolio/employer-review-20261012]
    paths: [.github/workflows/stage-public-review.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          ref: portfolio/employer-review-20261012
      - name: Apply only the owner-authorized, checksum-bound public patch
        shell: bash
        run: |
          python3 -B -S - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess, sys, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          BRANCH = 'portfolio/employer-review-20261012'
          TRANSPORT = '2dd303c5dc1cee9a47250427c4640eca358a40a7655b8900dc2baf098ed0e831'
          CONTENT = 'a9bce36720d189e17647708a4f6db69a0f08201cbed22d720ca04c56883284bf'
          SOURCE = 'https://raw.githubusercontent.com/alvaromendizabal/lava-aws-multilingual-docvqa/104f1bbee6b06655f876c24fbea1f5bd9488c785/.review-staging/'
          ALLOWED = {'README.md', 'review/README.md', 'review/project.json', 'review/run.py', 'review/test_run.py', 'review/template.html', 'review/index.html', '.github/workflows/employer-review.yml'}
          EXCLUDED = {'alvaromendizabal/home-credit-model-stability', 'alvaromendizabal/march-machine-learning-mania-2026'}
          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          require(os.environ['GITHUB_REF_NAME'] == BRANCH, 'Wrong staging branch')
          repo = os.environ['GITHUB_REPOSITORY']
          require(repo not in EXCLUDED, 'Excluded repository')
          def part(index):
              with urllib.request.urlopen(SOURCE + f'patch-{index:02d}.txt', timeout=30) as response:
                  value = response.read(10001)
              require(len(value) <= 10000, 'Oversized transport part')
              return value
          with ThreadPoolExecutor(max_workers=6) as pool:
              encoded = b''.join(pool.map(part, range(6)))
          packed = base64.b64decode(encoded, validate=True)
          require(sha(packed) == TRANSPORT, 'Transport checksum mismatch')
          raw = lzma.decompress(packed, memlimit=128 * 1024 * 1024)
          require(len(raw) == 271910 and sha(raw) == CONTENT, 'Content checksum mismatch')
          package = json.loads(raw)
          require(package['schema_version'] == 1, 'Unsupported patch schema')
          require(repo in package['repositories'], 'Repository outside authorized patch')
          patch = package['repositories'][repo]
          require(set(patch['files']) == ALLOWED, 'Patch path allowlist mismatch')
          require(git('rev-parse', 'HEAD^') == patch['base'], 'Staging parent changed')
          require(sha(Path('README.md').read_bytes()) == patch['original_readme_sha256'], 'README changed')
          initial = git('rev-parse', 'HEAD')
          for name, expected in patch['files'].items():
              path = Path(name)
              require(not any(Path(*path.parts[:i]).is_symlink() for i in range(1, len(path.parts) + 1)), 'Symlink in target path')
              data = package['blobs'][expected].encode('utf-8')
              require(sha(data) == expected, 'Individual file checksum mismatch')
              if name == '.github/workflows/employer-review.yml':
                  require(path.is_file() and sha(path.read_bytes()) == expected, 'Review workflow must already match the connector-authored version')
                  continue
              require(name == 'README.md' or not path.exists(), 'Refusing to overwrite an existing new review file')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          subprocess.run([sys.executable, '-B', '-S', '-m', 'unittest', 'discover', '-s', 'review', '-p', 'test_run.py'], check=True, timeout=60)
          subprocess.run([sys.executable, '-B', '-S', 'review/run.py', '--check-page'], check=True, timeout=30)
          for name, expected in patch['files'].items():
              require(sha(Path(name).read_bytes()) == expected, 'Validated file changed')
          subprocess.run(['git', 'add', '--', *sorted(ALLOWED)], check=True)
          changed = set(git('diff', '--cached', '--name-only').splitlines())
          require(changed == ALLOWED - {'.github/workflows/employer-review.yml'}, 'Unexpected staged changes')
          require(git('rev-parse', 'HEAD') == initial, 'Branch moved during staging')
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'feat: add tested source-linked employer review and bounded public verification'], check=True)
          commit = git('rev-parse', 'HEAD')
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/' + BRANCH], check=True)
          receipt = {'repository': repo, 'base': patch['base'], 'commit': commit, 'transport_sha256': TRANSPORT, 'files': patch['files'], 'status': 'staged_and_verified'}
          Path(os.environ['RUNNER_TEMP'], 'public-review-staging.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY
      - name: Retain exact publication receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-review-staging
          path: ${{ runner.temp }}/public-review-staging.json
          if-no-files-found: error
          retention-days: 14
