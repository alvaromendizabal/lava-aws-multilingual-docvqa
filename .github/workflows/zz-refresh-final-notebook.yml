name: Refresh canonical notebook evidence
on:
  push:
    branches: [maintenance/final-clean-20261018]
    paths: [.github/workflows/zz-refresh-final-notebook.yml]
permissions:
  contents: write
jobs:
  notebook:
    if: github.repository == 'alvaromendizabal/lava-aws-multilingual-docvqa'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.10'
          python-version: '3.12.13'
          enable-cache: true
      - name: Refuse unrelated branch changes
        run: |
          test "$(git rev-parse origin/main)" = b9b5cc853bb1b32c3876c6fe3829fa92eedb2148
          git diff --exit-code 7dc03cc59c8bf1db14513b264a1b0704b0c184ac HEAD -- . ':(exclude).github/workflows/zz-refresh-final-notebook.yml'
      - name: Execute in a real clean kernel and publish verified outputs
        run: |
          uv sync --frozen --group judge
          uv run --frozen --group judge python -m ipykernel install --user --name lava
          uv run --frozen --group judge python scripts/execute_notebooks.py --publish
          uv run --frozen --group judge python scripts/validate_public_notebooks.py
          uv run --frozen --group judge pytest -q tests/unit/test_published_notebooks.py
          uv run --frozen --group judge python scripts/execute_notebooks.py --publish
      - name: Commit only the canonical notebook and its genuine execution manifest
        run: |
          git add notebooks/05_end_to_end_system_evaluation.ipynb reports/notebook_execution/05_end_to_end_system_evaluation.manifest.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Republish executed notebook after removal of redundant analysis inputs'
          git push origin HEAD:maintenance/final-clean-20261018
          mkdir -p "$RUNNER_TEMP/notebook-refresh"
          cp notebooks/05_end_to_end_system_evaluation.ipynb "$RUNNER_TEMP/notebook-refresh/"
          cp reports/notebook_execution/05_end_to_end_system_evaluation.manifest.json "$RUNNER_TEMP/notebook-refresh/"
          git rev-parse HEAD > "$RUNNER_TEMP/notebook-refresh/commit.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: final-canonical-notebook-refresh
          path: ${{ runner.temp }}/notebook-refresh/
          if-no-files-found: error
          retention-days: 7
