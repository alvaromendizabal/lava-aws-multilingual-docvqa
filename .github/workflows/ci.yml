name: ci

on:
  pull_request:
  push:
    branches: [main, 'feat/**']

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.10'
          python-version: '3.12.13'
          enable-cache: true
      - name: Run the complete retained quality gate
        shell: bash
        run: |
          set -o pipefail
          bash scripts/quality_gate.sh 2>&1 | tee "$RUNNER_TEMP/quality.log"
      - name: Re-execute the canonical notebook and verify reuse
        shell: bash
        run: |
          set -o pipefail
          make notebooks 2>&1 | tee "$RUNNER_TEMP/notebooks.log"
      - name: Package current public source and actual validation evidence
        if: always()
        shell: bash
        run: |
          touch "$RUNNER_TEMP/quality.log" "$RUNNER_TEMP/notebooks.log"
          git archive --format=zip --output="$RUNNER_TEMP/source.zip" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/source_commit.txt"
          tar -czf "$RUNNER_TEMP/notebooks.tar.gz" notebooks reports/notebook_execution
          cd "$RUNNER_TEMP"
          sha256sum source.zip quality.log notebooks.log notebooks.tar.gz source_commit.txt > evidence.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source.zip
            ${{ runner.temp }}/source_commit.txt
            ${{ runner.temp }}/quality.log
            ${{ runner.temp }}/notebooks.log
            ${{ runner.temp }}/notebooks.tar.gz
            ${{ runner.temp }}/evidence.sha256
          if-no-files-found: error
          retention-days: 14
