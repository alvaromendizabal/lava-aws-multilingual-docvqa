name: ci

on:
  push:
    branches:
      - "feat/complete-system-evaluation"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Reconcile reviewed portfolio presentation
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          main = "dc87745f9c63ddb009ee4436aac07d47d7105ad3"
          reviewed = "192bd3e948c6d10624459753e99476434d281250"
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          if git("rev-parse", "origin/main") != main:
              raise SystemExit("Main changed; review the concurrent changes before publication")
          if git("diff", "--name-only", reviewed, "HEAD") != ".github/workflows/ci.yml":
              raise SystemExit("Integration source differs from the reviewed head")
          for key, value in (("user.name", "github-actions[bot]"), ("user.email", "41898282+github-actions[bot]@users.noreply.github.com")):
              subprocess.run(["git", "config", key, value], check=True)
          files = [
              "README.md", "docs/architecture.md", "docs/evaluation.md", "docs/retrieval.md", "docs/submission.md",
              "notebooks/00_reproducibility_and_protocol.ipynb", "notebooks/01_oracle_reader_benchmark_design.ipynb",
              "notebooks/02_verified_gpu_execution.ipynb", "notebooks/03_model_scaling_and_cost.ipynb",
              "notebooks/04_evidence_retrieval.ipynb", "notebooks/README.md",
              "tests/unit/test_published_notebooks.py", "tests/unit/test_repository_structure.py",
          ]
          changed = set(git("diff", "--name-only", "4d3db88c8b8f45055b2ff2ae811a33673cc5cd61", main).splitlines())
          if changed != set(files):
              raise SystemExit("Concurrent source differs from the reviewed presentation change")
          merge = subprocess.run(["git", "merge", "--no-commit", "--no-ff", main])
          if merge.returncode not in (0, 1):
              raise SystemExit("Merge failed before content resolution")
          conflicts = set(git("diff", "--name-only", "--diff-filter=U").splitlines())
          if not conflicts.issubset(files):
              raise SystemExit("Unreviewed merge conflicts")
          subprocess.run(["git", "restore", "--source", main, "--staged", "--worktree", "--", *files], check=True)
          p = Path("README.md")
          text = p.read_text().replace("All five canonical notebooks", "All six canonical notebooks").replace("**Readable evidence:** five executed notebooks", "**Readable evidence:** six executed notebooks")
          summary = json.loads(Path("reports/oracle_reader/runs/lava-oracle-qwen35-4b-fused-direct-20260906180137/semantic_summary.json").read_text())
          text = text.replace("50.63%", f"{summary['metrics']['question_micro']['answer']:.2%}")
          lines = text.splitlines()
          position = next(i for i, line in enumerate(lines) if line.startswith("| [04 —"))
          lines.insert(position + 1, "| [05 — Retrieved-evidence extension](notebooks/05_end_to_end_system_evaluation.ipynb) | Implemented integration, actual measurement status, failure analysis and recovery |")
          text = "\n".join(lines) + "\n"
          text = text.replace("## Reproduce and inspect", "The retrieved-page pipeline is implemented; Notebook 05 reports its measurement status. Its actual answer score remains explicitly unmeasured until the GPU experiment runs. `make system-preview` inspects the plan without paid compute; `make finish CHARGES=YES` explicitly authorizes one bounded GPU attempt, then scores saved answers, executes all six notebooks, runs the quality gate and archives verified outputs. See [the operator guide](docs/system_evaluation.md) for cost limits and recovery. This extension does not invalidate the completed component benchmark.\n\n## Reproduce and inspect")
          p.write_text(text)
          p = Path("notebooks/README.md")
          p.write_text(p.read_text() + "\n\n## Optional integrated evaluation\n\n[05 — Retrieved-evidence evaluation](05_end_to_end_system_evaluation.ipynb) explains the label-blind input design, actual measurement status, failure analysis and recovery. It can be viewed without a GPU. The measured component benchmark remains complete; the charge-gated extension is operated through [the normal finish command](../docs/system_evaluation.md).\n")
          p = Path("tests/unit/test_published_notebooks.py")
          text = p.read_text().replace('        "04": "Full-document retrieval evaluated",', '        "04": "Full-document retrieval evaluated",\n        "05": "Current end-to-end status",')
          p.write_text(text)
          p = Path("docs/system_evaluation.md")
          text = p.read_text().replace("# Final retrieved-evidence pilot", "# Retrieved-evidence extension")
          text = text.replace("This is the final **scoped research-portfolio** milestone.", "The **component-level research portfolio is complete**. This guide operates the separately scoped retrieved-evidence extension.")
          p.write_text(text.replace("v1.0.0", "v1.1.0"))
          p = Path("notebooks/05_end_to_end_system_evaluation.ipynb")
          notebook = json.loads(p.read_text())
          for cell in notebook["cells"]:
              text = "".join(cell["source"]).replace("The next required action is", "The action that measures this optional extension is")
              cell["source"] = text.splitlines(keepends=True)
          p.write_text(json.dumps(notebook, indent=1, ensure_ascii=False) + "\n")
          subprocess.run(["git", "add", "README.md", "notebooks", "docs", "tests"], check=True)
          if git("diff", "--name-only", "--diff-filter=U"):
              raise SystemExit("Unresolved conflicts remain")
          subprocess.run(["git", "commit", "-m", "Merge completed portfolio presentation with optional retrieved-evidence integration", "-m", "Preserve the measured results-first overview and all concurrent regression tests. Use metric-consistent percentage formatting. Add the independently scoped sixth notebook and execution path without reopening the completed component benchmark. Preserve both branches' ancestry."], check=True)
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.10"
          python-version: "3.12"
          enable-cache: true

      - name: Execute six notebooks and verify reuse
        shell: bash
        run: |
          set -o pipefail
          uv sync --frozen --group judge
          uv run --frozen python -m ipykernel install --user --name lava --display-name LAVA
          uv run --frozen ruff format src tests scripts pipelines notebooks
          git add notebooks tests
          if ! git diff --cached --quiet; then
            git commit -m "style: format the reconciled notebook sources"
          fi
          make notebooks 2>&1 | tee "$RUNNER_TEMP/notebooks.log"
          make notebooks 2>&1 | tee -a "$RUNNER_TEMP/notebooks.log"

      - name: Run canonical quality gate
        shell: bash
        run: |
          set -o pipefail
          bash scripts/quality_gate.sh 2>&1 | tee "$RUNNER_TEMP/quality.log"

      - name: Publish validated reconciliation
        shell: bash
        run: |
          git add notebooks reports/notebook_execution
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish the reconciled six-notebook walkthrough" -m "All canonical notebooks executed and passed publication integrity. Preserve the completed component results and explicit unmeasured extension. Publish only after the full quality gate; no new model inference or AWS job."
          fi
          git fetch origin feat/complete-system-evaluation main
          test "$(git rev-parse origin/feat/complete-system-evaluation)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = dc87745f9c63ddb009ee4436aac07d47d7105ad3
          git diff --exit-code "$GITHUB_SHA" HEAD -- .github/workflows
          git push origin HEAD:refs/heads/feat/complete-system-evaluation

      - name: Package validation evidence
        if: always()
        shell: bash
        run: |
          touch "$RUNNER_TEMP/quality.log" "$RUNNER_TEMP/notebooks.log"
          git bundle create "$RUNNER_TEMP/source.bundle" HEAD refs/remotes/origin/main
          git rev-parse HEAD > "$RUNNER_TEMP/source_commit.txt"
          tar -czf "$RUNNER_TEMP/notebooks.tar.gz" notebooks reports/notebook_execution
          cd "$RUNNER_TEMP"
          sha256sum source.bundle quality.log notebooks.log notebooks.tar.gz source_commit.txt > evidence.sha256

      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source.bundle
            ${{ runner.temp }}/source_commit.txt
            ${{ runner.temp }}/quality.log
            ${{ runner.temp }}/notebooks.log
            ${{ runner.temp }}/notebooks.tar.gz
            ${{ runner.temp }}/evidence.sha256
          if-no-files-found: error
          retention-days: 30
