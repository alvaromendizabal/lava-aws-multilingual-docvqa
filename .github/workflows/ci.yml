name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Run canonical quality gate
        shell: bash
        run: |
          set -o pipefail
          bash scripts/quality_gate.sh 2>&1 | tee "$RUNNER_TEMP/quality.log"

      - name: Package public validation evidence
        if: always()
        shell: bash
        run: |
          git bundle create "$RUNNER_TEMP/source.bundle" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/source_commit.txt"
          cd "$RUNNER_TEMP"
          sha256sum source.bundle quality.log source_commit.txt > evidence.sha256

      - name: Retain public validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source.bundle
            ${{ runner.temp }}/source_commit.txt
            ${{ runner.temp }}/quality.log
            ${{ runner.temp }}/evidence.sha256
          if-no-files-found: error
          retention-days: 30
