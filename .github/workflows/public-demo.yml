name: Public demo

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up dependency-free Python checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Set up JavaScript test runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - name: Verify the static publication boundary
        run: |
          python -m unittest discover -s tools -p 'test_public_demo_boundary.py'
          python tools/check_public_demo.py > "$RUNNER_TEMP/public-demo-boundary.json"
      - name: Test the actual browser demo engine and controls
        run: node tools/test_public_demo.mjs
      - name: Retain the runnable public demo
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: public-demo
          path: public-demo/
          if-no-files-found: error
          retention-days: 14
      - name: Retain content hashes for the reviewed demo
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: public-demo-boundary
          path: ${{ runner.temp }}/public-demo-boundary.json
          if-no-files-found: error
          retention-days: 14
