name: Apply final document QA scope
on:
  push:
    branches: [cleanup/public-surface-20261018]
    paths: [.github/workflows/zz-session-curation-20261018.yml]
permissions:
  contents: write
jobs:
  curate:
    if: github.repository == 'alvaromendizabal/lava-aws-multilingual-docvqa'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.13.15'
          enable-cache: false
      - name: Verify and apply exact reviewed source changes
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, shutil, subprocess, zlib
          root=pathlib.Path.cwd()
          encoded=(root/'.cleanup-20261018/part0').read_text().strip()
          if hashlib.sha256(encoded.encode()).hexdigest()!='5661888da27aa5c76ba2abd71dc7c0ae49f690dc1591246badd670ae931bd678': raise ValueError('Unexpected preparation input')
          repairs=[[1656,1657,''],[2034,2035,''],[2149,2150,''],[3465,3466,''],[3606,3608,''],[3784,3785,''],[4590,4591,''],[5295,5296,''],[5354,5355,''],[11279,11280,'']]
          for start,end,text in reversed(repairs): encoded=encoded[:start]+text+encoded[end:]
          if hashlib.sha256(encoded.encode()).hexdigest()!='68473f6d41989800d0591bf9b98025b26d85cc19b49c2bc32c9a59036ca0b404': raise ValueError('Transport repair mismatch')
          raw=zlib.decompress(base64.b64decode(encoded,validate=True))
          if hashlib.sha256(raw).hexdigest()!='83b0f6f9fec026bf80b79fbec4ccb8627517340017211189c24e53169f9e732f': raise ValueError('Change-plan mismatch')
          plan=json.loads(raw)
          if plan['repository']!=os.environ['GITHUB_REPOSITORY']: raise ValueError('Wrong repository')
          main=subprocess.check_output(['git','rev-parse','origin/main'],text=True).strip()
          if main!=plan['base']: raise ValueError('Main advanced; reconcile before applying')
          extra=subprocess.check_output(['git','diff','--name-only',main,'HEAD'],text=True).splitlines()
          if any(not(p.startswith('.cleanup-20261018/') or p.startswith('.github/workflows/zz-session-')) for p in extra): raise ValueError('Unrelated branch work exists')
          def path(name):
              p=root/name
              if not p.resolve().is_relative_to(root) or p.is_symlink() or '.git' in p.parts: raise ValueError('Unsafe path')
              return p
          for row in plan['changes']:
              p=path(row['path'])
              actual=hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
              if actual!=row['before']: raise ValueError('Source changed: '+row['path'])
          for name in plan['delete']:
              p=path(name)
              if p.is_dir(): shutil.rmtree(p)
              elif p.is_file(): p.unlink()
              else: raise ValueError('Missing retirement path: '+name)
          for row in plan['changes']:
              p=path(row['path'])
              if 'edits' in row:
                  text=p.read_text()
                  for start,end,replacement in reversed(row['edits']): text=text[:start]+replacement+text[end:]
              else: text=row['text']
              data=text.encode()
              if hashlib.sha256(data).hexdigest()!=row['after']: raise ValueError('Output mismatch: '+row['path'])
              p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(data)
          print('Applied',len(plan['changes']),'verified changes;',len(plan['delete']),'retirement entries')
      - name: Install and format the retained locked project
        run: |
          uv sync --frozen --group dev --group mlops --group cloud --group notebooks
          uv run --frozen ruff format src tests scripts
          uv run --frozen ruff check --fix src tests scripts
          uv run --frozen ruff format src tests scripts
          uv run --frozen ruff check src tests scripts
      - name: Publish actual results from a clean notebook kernel
        run: |
          uv run --frozen --group notebooks python -m ipykernel install --user --name lava
          uv run --frozen --group notebooks python scripts/execute_notebooks.py --publish
          python3 -B -S review/run.py --render
          python3 -B -S review/run.py --output "$RUNNER_TEMP/public-review"
          python3 -B -S review/run.py --output "$RUNNER_TEMP/public-review" --check
      - name: Publish only source changes to the review branch
        run: |
          git restore --source=HEAD --staged --worktree .github/workflows
          git rm -rf --ignore-unmatch .cleanup-20261018
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep '^.github/workflows/'; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Curate the final document-QA pipeline; retire unused research and operator tooling'
          git push origin HEAD:cleanup/public-surface-20261018
          git archive --format=zip --output="$RUNNER_TEMP/public-source.zip" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/public-source-commit.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: curated-public-source
          path: |
            ${{ runner.temp }}/public-source.zip
            ${{ runner.temp }}/public-source-commit.txt
          retention-days: 3
          if-no-files-found: warn
