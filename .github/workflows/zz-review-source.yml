name: Public source verification snapshot
on:
  push:
    branches: [cleanup/review-closeout-20261019]
    paths: [.github/workflows/zz-review-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Export only the eight authorized public repositories
        shell: python
        run: |
          import concurrent.futures, hashlib, json, os, pathlib, urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'sources'; out.mkdir()
          expected={
            'home-credit-model-stability':'ecd8bdecd17f5a4c2394dc5170fdf9717dd8a6c4',
            'nfl-player-trajectory':'54e7b90e16f629e53c96014e873fd442f0c7002e',
            'jigsaw-rule-classifier':'1a0f72620d0035ef99b37c2c36a73332e3f310da',
            'commodity-prediction':'e745c0b57e23ad30ad17165e3e78af62a920f74c',
            'kaggriculture':'1b95ed3239b1f7ae2f326c0f240f0265c3b9ef2d',
            'lava-aws-multilingual-docvqa':'b9b5cc853bb1b32c3876c6fe3829fa92eedb2148',
            'biohub-cell-tracking-during-development':'5ea508a4325439caa45963d10e33ec4f6bf5e2b4',
            'rsna-knee-abnormality-detection':'996cccf1addc0d297985e8570a13332ceb7e3928'}
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'public-source-review','Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=90) as r:return r.read()
          def collect(item):
              name,sha=item;api=f'https://api.github.com/repos/alvaromendizabal/{name}'
              head=json.loads(get(api+'/git/ref/heads/main'))['object']['sha']
              if head!=sha:raise RuntimeError(name+': main changed')
              info=json.loads(get(api));commit=json.loads(get(api+'/git/commits/'+sha))
              runs=json.loads(get(api+f'/actions/runs?head_sha={sha}&event=push&per_page=100'))
              prs=json.loads(get(api+'/pulls?state=all&per_page=100'))
              branches=json.loads(get(api+'/branches?per_page=100'))
              raw=get(f'https://codeload.github.com/alvaromendizabal/{name}/zip/{sha}')
              (out/(name+'.zip')).write_bytes(raw)
              meta={'name':name,'sha':sha,'tree':commit['tree']['sha'],'commit_message':commit['message'],
                    'description':info['description'],'homepage':info.get('homepage'),'topics':info.get('topics'),
                    'archive_sha256':hashlib.sha256(raw).hexdigest(),'archive_bytes':len(raw),
                    'runs':[{'id':x['id'],'name':x['name'],'status':x['status'],'conclusion':x['conclusion'],'url':x['html_url']} for x in runs['workflow_runs']],
                    'prs':[{'number':x['number'],'title':x['title'],'state':x['state'],'merged_at':x.get('merged_at'),'merge_sha':x.get('merge_commit_sha'),'head':x['head']['ref'],'head_sha':x['head']['sha'],'url':x['html_url']} for x in prs],
                    'branches':[{'name':x['name'],'sha':x['commit']['sha']} for x in branches]}
              (out/(name+'.json')).write_text(json.dumps(meta,indent=2));return meta
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:records=list(pool.map(collect,expected.items()))
          (out/'manifest.json').write_text(json.dumps(records,indent=2))
          print(json.dumps([{'name':r['name'],'sha':r['sha'],'files_archive_bytes':r['archive_bytes']} for r in records]))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: current-eight-public-sources
          path: ${{ runner.temp }}/sources/
          retention-days: 3
          if-no-files-found: error
