name: Refresh final notebook evidence
on:
  push:
    branches: [cleanup/public-surface-20261018]
    paths: [.github/workflows/zz-refresh-final-evidence.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.10'
          python-version: '3.12.13'
          enable-cache: true
      - name: Execute and verify reuse, never manufacture notebook outputs
        run: |
          uv sync --frozen --group judge
          uv run --frozen python -m ipykernel install --user --name lava
          make notebooks
          make notebooks
          uv run --frozen python scripts/validate_public_notebooks.py
      - name: Publish only the executed notebook and its source-bound manifest
        run: |
          git add notebooks/05_end_to_end_system_evaluation.ipynb reports/notebook_execution/05_end_to_end_system_evaluation.manifest.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Re-execute final document-QA review with the complete retained evidence set'
          git push origin HEAD:cleanup/public-surface-20261018
